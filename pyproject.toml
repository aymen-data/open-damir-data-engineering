[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "open-damir-pipeline"
version = "0.1.0"
description = "Pipeline pédagogique sur les données publiques réelles Open DAMIR"
requires-python = ">=3.11"
dependencies = ["polars==1.44.2", "duckdb==1.5.5", "requests==2.34.2", "psutil==7.2.2", "pyarrow==25.0.1"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
damir = "damir.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
damir = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
